version: '3'

tasks:
  dev:
    desc: Start local Temporal dev server
    cmds:
      - temporal server start-dev

  proto:
    desc: Generate Go and Python code from .proto files
    cmds:
      - buf generate

  worker:go:
    desc: Run the Go upload worker
    dir: workers/go
    cmds:
      - go run .

  worker:py:
    desc: Run the Python processing worker
    dir: workers/python
    cmds:
      - uv run python -m darkroom.worker

  workers:
    desc: Run both workers in parallel
    deps: [worker:go, worker:py]

  test:go:
    dir: workers/go
    cmds:
      - go test ./...

  test:py:
    dir: workers/python
    cmds:
      - uv run pytest

  test:
    desc: Run all tests
    deps: [test:go, test:py]

  lint:
    desc: Lint both languages
    cmds:
      - cmd: golangci-lint run
        dir: workers/go
      - cmd: uv run ruff check .
        dir: workers/python
      - cmd: uv run mypy src
        dir: workers/python

  dev:
    desc: Temporal dev server (history persists in temporal.db)
    cmds:
      - temporal server start-dev --db-filename temporal.db

  wait:temporal:
    internal: true
    cmds:
      - powershell -NoProfile -Command "while (-not (Test-NetConnection localhost -Port 7233 -InformationLevel Quiet)) { Start-Sleep -Seconds 1 }"

  worker:orchestrator:
    desc: Go workflow worker
    dir: workers/go
    deps: [wait:temporal]
    cmds:
      - go run ./cmd/orchestrator

  worker:uploader:
    desc: Go upload/discovery worker
    dir: workers/go
    deps: [wait:temporal]
    cmds:
      - go run ./cmd/uploader

  worker:py:
    desc: Python filter worker
    dir: workers/python
    deps: [wait:temporal]
    env:
      PYTHONPATH: gen
    cmds:
      - uv run python -m darkroom_py.worker

  workers:
    desc: All three workers (server must already be running)
    deps: [worker:orchestrator, worker:uploader, worker:py]

  up:
    desc: Server plus all workers
    deps: [dev, workers]