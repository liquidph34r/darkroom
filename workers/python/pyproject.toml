[project]
name = "darkroom-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Rose", email = "andyrose1232@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "imagehash>=4.3.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "protobuf>=7.36.2",
    "rawpy>=0.27.1",
    "temporalio>=1.34.0",
]

[project.scripts]
darkroom-worker = "darkroom_py.worker:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pyright]
extraPaths = ["gen"]
